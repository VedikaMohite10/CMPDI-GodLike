[pytest]
# Mark definitions
markers =
    integration: requires running CMPDI stack (API + Postgres + Qdrant)
    llm: additionally requires Ollama with configured models loaded

# Default options
addopts = --tb=short -q

# Test discovery
testpaths = tests test_phase3_unit.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio (for existing test_phase4.py and any async tests)
asyncio_mode = auto

# Timeout (per test) — LLM calls on CPU can be slow
timeout = 300
